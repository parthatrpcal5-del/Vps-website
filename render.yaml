services:
  - type: web
    name: apex-hosting
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: apex-hosting-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
